# PCS Vector — Streamlit configuration (local + Streamlit Community Cloud)

[theme]
primaryColor = "#D4AF37"
backgroundColor = "#121E16"
secondaryBackgroundColor = "#1C2D22"
textColor = "#FFFFFF"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
fastReruns = true

[client]
showErrorDetails = false
